No confirmed scheduled-run failure could be identified from the GitHub connector data available to me. The connector can inspect jobs and logs when a run ID is already known, but it did not expose a repository-wide list of recent schedule-triggered runs. Therefore, I cannot reliably claim that all seven workflows passed, failed, or ran on schedule.

