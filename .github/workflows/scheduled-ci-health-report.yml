name: Scheduled - CI Health Report

on:
  workflow_dispatch:
  schedule:
    # Daily at 12:30 UTC, after the repository's existing scheduled scans.
    - cron: '30 12 * * *'

permissions:
  actions: read
  issues: write

concurrency:
  group: scheduled-ci-health-report
  cancel-in-progress: true

jobs:
  report:
    name: scheduled / ci-health-report
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Update scheduled CI health issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_TITLE: Scheduled CI Health Report
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const now = new Date();

            const configured = [
              { name: 'Playwright Smoke', file: 'playwright-smoke.yml', cadence: 'Daily', staleHours: 36 },
              { name: 'Semgrep', file: 'semgrep.yml', cadence: 'Daily', staleHours: 36 },
              { name: 'ClamAV', file: 'clamav.yml', cadence: 'Daily', staleHours: 36 },
              { name: 'Wordfence CLI', file: 'wordfence-cli.yml', cadence: 'Daily', staleHours: 36 },
              { name: 'Codacy', file: 'codacy.yml', cadence: 'Weekly (Monday)', staleHours: 192 },
              { name: 'OWASP ZAP Baseline', file: 'zap-baseline.yml', cadence: 'Weekly (Monday)', staleHours: 192 },
              { name: 'OpenSSF Scorecard', file: 'scorecard.yml', cadence: 'Weekly (Saturday)', staleHours: 192 },
            ];

            const escapeMarkdown = (value) => String(value ?? '')
              .replaceAll('|', '\\|')
              .replace(/\r?\n/g, '<br>');

            const rows = [];
            let healthy = 0;
            let attention = 0;
            let running = 0;

            for (const item of configured) {
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: item.file,
                  event: 'schedule',
                  per_page: 1,
                });

                const run = data.workflow_runs[0];
                if (!run) {
                  attention += 1;
                  rows.push(`| ❓ ${item.name} | ${item.cadence} | No scheduled run found | — | — | — |`);
                  continue;
                }

                const result = run.conclusion ?? run.status;
                const startedAt = new Date(run.run_started_at ?? run.created_at);
                const ageHours = Math.max(0, Math.floor((now - startedAt) / 3_600_000));
                const isRunning = ['queued', 'requested', 'waiting', 'pending', 'in_progress'].includes(result);
                const isStale = result === 'success' && ageHours > item.staleHours;

                let icon = '⚠️';
                let resultText = result;

                if (isStale) {
                  resultText += `; stale after ${item.staleHours}h`;
                  attention += 1;
                } else if (isRunning) {
                  icon = '⏳';
                  running += 1;
                } else if (result === 'success') {
                  icon = '✅';
                  healthy += 1;
                } else {
                  icon = ['failure', 'timed_out', 'action_required', 'startup_failure'].includes(result)
                    ? '❌'
                    : '⚠️';
                  attention += 1;
                }

                let jobs = '—';
                if (run.status === 'completed' && run.conclusion !== 'success') {
                  const { data: jobData } = await github.rest.actions.listJobsForWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                    filter: 'latest',
                    per_page: 100,
                  });

                  const nonSuccessJobs = jobData.jobs
                    .filter((job) => !['success', 'skipped'].includes(job.conclusion ?? job.status))
                    .map((job) => `${escapeMarkdown(job.name)} (job ID \`${job.id}\`, ${job.conclusion ?? job.status})`);

                  if (nonSuccessJobs.length > 0) jobs = nonSuccessJobs.join('<br>');
                }

                const { data: artifactData } = await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                });

                const artifacts = artifactData.artifacts.length > 0
                  ? artifactData.artifacts
                    .map((artifact) => `${escapeMarkdown(artifact.name)} (artifact ID \`${artifact.id}\`)`)
                    .join('<br>')
                  : 'None';

                const latestRun = [
                  `[#${run.run_number}](${run.html_url})`,
                  `run ID \`${run.id}\``,
                  startedAt.toISOString(),
                  `${ageHours}h ago`,
                ].join('<br>');

                rows.push(`| ${icon} ${item.name} | ${item.cadence} | ${latestRun} | ${escapeMarkdown(resultText)} | ${jobs} | ${artifacts} |`);
              } catch (error) {
                attention += 1;
                core.warning(`Could not inspect ${item.file}: ${error.message}`);
                rows.push(`| ⚠️ ${item.name} | ${item.cadence} | API query failed | — | — | — |`);
              }
            }

            const body = [
              '# Scheduled CI Health Report',
              '',
              `_Last refreshed: ${now.toISOString()}_`,
              '',
              `Automatically updated by [the CI health workflow](${process.env.REPORT_RUN_URL}).`,
              '',
              '## Summary',
              '',
              `- Scheduled workflows checked: **${configured.length}**`,
              `- Healthy: **${healthy}**`,
              `- Needs attention: **${attention}**`,
              `- Running or queued: **${running}**`,
              '',
              '## Latest scheduled run per workflow',
              '',
              '| Workflow | Cadence | Latest scheduled run | Result | Failed/non-success jobs | Artifacts |',
              '|---|---|---|---|---|---|',
              ...rows,
              '',
              '## Interpretation',
              '',
              '- This report is advisory and does not turn advisory scanner findings into merge blockers.',
              '- A successful scanner workflow means execution completed; review its logs, annotations, SARIF, and artifacts for findings.',
              '- Run IDs, job IDs, and artifact IDs are included so connected tooling can inspect the underlying results.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === process.env.REPORT_TITLE,
            );

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: process.env.REPORT_TITLE,
                body,
              });
            }

            await core.summary.addRaw(body).write();

